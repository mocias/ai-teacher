<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>主 Agent · AI Teacher</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/conversation.css"></head>
<body class="agent-page"><a class="skip-link" href="#content">跳到消息输入框</a><aside class="agent-rail" id="agent-navigation"></aside><main class="agent-workbench">
<header class="agent-page-header"><div class="agent-title"><a class="agent-mobile-back" href="/" aria-label="返回学习概览">‹</a><span class="assistant-title-mark" aria-hidden="true">A</span><div><h1>主 Agent</h1><p>你的学习工作台配置助手</p></div></div><div class="agent-header-actions"><a href="/?view=models" class="agent-config-link">模型与分工</a><button id="session-toggle" class="ghost small" aria-expanded="false" aria-controls="session-info">会话信息</button></div></header>
<section class="agent-chat-panel" aria-label="与主 Agent 对话"><div id="session-info" class="agent-session-info" hidden></div><div id="error" class="agent-error" role="alert" hidden></div><div class="agent-message-area"><section id="messages" class="messages" tabindex="0" role="log" aria-label="对话记录" aria-live="polite" aria-relevant="additions text"></section><button id="jump-latest" class="jump-latest" hidden>↓ 回到最新回复</button></div><div class="agent-composer-area"><div id="status" class="agent-execution" role="status" aria-live="polite"></div><form id="agent-chat" class="composer"><label for="content" class="sr-only">与主 Agent 讨论</label><textarea id="content" name="message" rows="1" required maxlength="20000" placeholder="说说你想怎样学习，或需要什么帮助…"></textarea><div class="composerbar"><div class="composer-tools"></div><small id="draft-status">Enter 发送，Shift + Enter 换行</small><button id="send" class="primary" type="submit" disabled>发送消息</button></div></form><p class="conversation-footnote">配置建议由你确认后生效，聊天记录保存在本机。</p></div></section></main><script type="module" src="/agent-chat.js"></script></body></html>
