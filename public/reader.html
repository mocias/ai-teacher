<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自主学习 · AI Teacher</title><link rel="stylesheet" href="/reader.css"><link rel="stylesheet" href="/conversation.css">
<body class="reader-page">
<header id="reader-header">
 <nav id="tabs" aria-label="阅读标签页"></nav>
 <form id="address-form">
  <button type="button" id="back" aria-label="后退">←</button><button type="button" id="forward" aria-label="前进">→</button><button type="button" id="reload">刷新</button>
  <input id="address" placeholder="输入网址，在新标签页打开" aria-label="网址"><button>打开网页</button><button type="button" id="library">资料库</button><button type="button" id="import">打开文件</button>
  <button type="button" id="reader-network-status" aria-controls="reader-network" title="查看阅读器网络设置">系统网络</button>
  <button type="button" id="reader-side-toggle" aria-controls="reader-side" aria-expanded="true" title="收起或展开阅读侧栏">收起侧栏 ›</button>
  <input hidden type="file" id="file" accept=".pdf,.md,.markdown,.ppt,.pptx">
 </form>
</header>
<main id="reader-empty">从资料库选择资料，或输入网址开始自主学习。</main>
<aside id="reader-side" aria-label="阅读答疑与笔记">
 <header class="reader-context"><p class="reader-eyebrow">当前阅读</p><h2 id="reading-title">阅读答疑</h2><p id="position"></p></header>
 <p id="status" role="status"></p>
 <details id="reader-network"><summary>网络与加载状态</summary><p id="reader-network-mode" class="hint">当前使用系统网络</p><p id="reader-network-error" role="alert" hidden></p><button id="reader-proxy" type="button" hidden>阅读器使用本机代理并重试</button><p id="reader-network-scope" class="hint" hidden>此设置用于所有阅读器网页标签页，重启后保留；不影响 DSH 或系统代理。</p></details>
 <div class="mark-actions" aria-label="选文与标记工具"><button id="select-ask" title="将选中的原文附到本次问题">选文提问</button><button id="highlight" title="保存选中文字的高亮标记">高亮</button><button id="underline" title="保存选中文字的划线标记">划线</button><button id="note" title="为当前页或选文保存笔记">记笔记</button></div>
 <div class="reader-tool-tabs" role="tablist" aria-label="阅读工具"><button type="button" id="reader-tab-chat" role="tab" aria-selected="true" aria-controls="reader-pane-chat" data-reader-pane="chat">答疑</button><button type="button" id="reader-tab-marks" role="tab" aria-selected="false" aria-controls="reader-pane-marks" tabindex="-1" data-reader-pane="marks">标记</button><button type="button" id="reader-tab-goals" role="tab" aria-selected="false" aria-controls="reader-pane-goals" tabindex="-1" data-reader-pane="goals">目标</button></div>
 <button type="button" id="reader-job-summary" hidden aria-controls="reader-pane-chat" aria-live="polite"></button>
 <section id="reader-pane-chat" class="reader-conversation" role="tabpanel" aria-labelledby="reader-tab-chat" tabindex="0">
  <h3 id="reader-chat-heading">阅读答疑</h3>
  <div class="reader-thread" tabindex="0" aria-label="阅读答疑记录">
   <p class="reader-chat-empty">有疑问时，可以直接提问，也可以在正文中选一段文字再提问。</p>
   <div id="messages" aria-live="polite"></div><div id="reading-jobs" aria-label="阅读答疑处理状态"></div>
  </div>
  <div class="reader-composer">
   <blockquote id="selection" aria-label="本次提问引用"></blockquote><button id="clear-selection" hidden>移除提问引用</button>
   <form id="ask-form"><label for="question" class="reader-sr-only">阅读问题</label><textarea id="question" required placeholder="阅读中有什么疑惑？可先在正文中选一段文字。" maxlength="20000"></textarea><button id="send">向 AI 提问</button></form>
   <p class="hint">用“选文提问”附上原文；发送时读取当前页或章节。阅读行为不代表掌握。</p>
  </div>
 </section>
 <section class="reader-collection" aria-label="阅读积累"><section id="reader-pane-marks" role="tabpanel" aria-labelledby="reader-tab-marks" tabindex="0" hidden><p class="reader-pane-intro">留下阅读中的重点与想法。</p><details id="reader-annotations" open><summary>标记与笔记</summary><div id="annotations"></div></details></section><section id="reader-pane-goals" role="tabpanel" aria-labelledby="reader-tab-goals" tabindex="0" hidden><p class="reader-pane-intro">把当前资料带入你的学习计划。</p><details id="reader-goals" open><summary>关联学习目标</summary><select id="goal" aria-label="选择学习目标"></select><button id="link">关联</button><div id="links"></div></details><footer class="reader-next"><button id="formal-goal" type="button">用于正式学习 →</button><button id="global-profile" type="button">整体学习画像</button></footer></section></section>
</aside>
<dialog id="picker"><h2>选择资料</h2><div id="resource-list"></div><button id="close-picker">关闭</button></dialog>
<dialog id="note-dialog"><form id="note-form"><h2>当前页 / 章节笔记</h2><textarea id="note-text" required maxlength="50000"></textarea><button type="submit">保存笔记</button><button id="cancel-note" type="button">取消</button></form></dialog>
<script type="module" src="/reader.js"></script>
</body></html>
