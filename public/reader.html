<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自主学习 · AI Teacher</title><link rel="stylesheet" href="/reader.css"><body><header id="reader-header"><nav id="tabs" aria-label="阅读标签页"></nav><form id="address-form"><button type="button" id="back" aria-label="后退">←</button><button type="button" id="forward" aria-label="前进">→</button><button type="button" id="reload">刷新</button><input id="address" placeholder="输入网址，在新标签页打开" aria-label="网址"><button>打开网页</button><button type="button" id="library">资料库</button><button type="button" id="import">打开文件</button><input hidden type="file" id="file" accept=".pdf,.md,.markdown,.ppt,.pptx"></form></header><main id="reader-empty">从资料库选择资料，或输入网址开始自主学习。</main><aside id="reader-side"><p id="status" role="status"></p><h2 id="reading-title">阅读答疑</h2><p id="position"></p><div class="mark-actions"><button id="select-ask">选文提问</button><button id="highlight">高亮</button><button id="underline">划线</button><button id="note">记笔记</button></div><blockquote id="selection"></blockquote><button id="clear-selection" hidden>清除选文</button><div id="messages" aria-live="polite"></div><div id="reading-jobs" aria-label="阅读答疑处理状态"></div><form id="ask-form"><textarea id="question" required placeholder="阅读中有什么疑惑？" maxlength="20000"></textarea><button id="send">向 AI 提问</button></form><p class="hint">提问时才读取当前页或章节。阅读行为不代表掌握。</p><details><summary>当前资料的标记与笔记</summary><div id="annotations"></div></details><details><summary>关联学习目标</summary><select id="goal"></select><button id="link">关联</button><div id="links"></div></details><button id="formal-goal" type="button">用于正式学习 →</button><button id="global-profile" type="button">查看整体学习画像</button></aside><dialog id="picker"><h2>选择资料</h2><div id="resource-list"></div><button id="close-picker">关闭</button></dialog><dialog id="note-dialog"><form id="note-form"><h2>当前页 / 章节笔记</h2><textarea id="note-text" required maxlength="50000"></textarea><button type="submit">保存笔记</button><button id="cancel-note" type="button">取消</button></form></dialog><script type="module" src="/reader.js"></script></body></html>
